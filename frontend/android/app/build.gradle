apply plugin: 'com.android.application'

// Release 서명 정보는 소스에 두지 않고 gradle property 또는 환경변수로 주입한다.
// 넷 중 하나라도 없으면 서명 없이 빌드한다 — 로컬 개발과 기존 CI(assembleDebug)가 그대로 동작해야 하기 때문.
def releaseSigning = [
        storeFile    : resolveSigningValue('androidKeystorePath', 'ANDROID_KEYSTORE_PATH'),
        storePassword: resolveSigningValue('androidKeystorePassword', 'ANDROID_KEYSTORE_PASSWORD'),
        keyAlias     : resolveSigningValue('androidKeyAlias', 'ANDROID_KEY_ALIAS'),
        keyPassword  : resolveSigningValue('androidKeyPassword', 'ANDROID_KEY_PASSWORD'),
]
def hasReleaseSigning = releaseSigning.every { it.value } && file(releaseSigning.storeFile).exists()

if (!hasReleaseSigning) {
    logger.lifecycle('Release signing config not provided — release APK will be unsigned.')
}

android {
    namespace = "com.softeerbootcamp.eightlisade"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.softeerbootcamp.eightlisade"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(resolveSigningValue('androidVersionCode', 'ANDROID_VERSION_CODE') ?: '1')
        versionName resolveSigningValue('androidVersionName', 'ANDROID_VERSION_NAME') ?: '1.0'
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.gms:play-services-location:21.4.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Capacitor 기본 블록을 대체한다. google-services.json은 .gitignore 대상이라 checkout에
// 포함되지 않고, 없으면 이 플러그인이 빠진 채 빌드가 성공한다. 그 APK에는 google_app_id
// 리소스가 없어 default FirebaseApp이 초기화되지 않고, 로그인 시 PushNotifications.register()가
// 메인 스레드에서 IllegalStateException을 던져 앱이 즉시 종료된다 (#151).
// 로컬 개발과 android-ci(assembleDebug)는 이 파일 없이도 동작해야 하므로 release에서만 끊는다.
def googleServicesJSON = file('google-services.json')
if (googleServicesJSON.exists() && googleServicesJSON.length() > 0) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('google-services.json not found — google-services plugin not applied. Push Notifications will not work.')
    gradle.taskGraph.whenReady { graph ->
        def releaseTask = graph.allTasks.find { it.project == project && it.name ==~ /(assemble|bundle)Release.*/ }
        if (releaseTask != null) {
            throw new GradleException(
                    'google-services.json이 없어 release 빌드를 중단한다. 이 설정 없이 만든 APK는 ' +
                            '로그인 시 앱이 종료된다. CI는 GOOGLE_SERVICES_JSON_BASE64 secret으로 ' +
                            'frontend/android/app/google-services.json을 복원해야 한다 (#151).'
            )
        }
    }
}

// gradle property를 우선 보고, 없으면 환경변수를 본다. 둘 다 없으면 null.
def resolveSigningValue(String propertyName, String envName) {
    def value = project.findProperty(propertyName) ?: System.getenv(envName)
    return value?.toString()?.trim() ?: null
}
