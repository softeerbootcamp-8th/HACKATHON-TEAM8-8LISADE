name: Deploy Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '배포할 버전 (예: 1.0.0). 태그 없이 수동 배포할 때만 사용.'
        required: true

concurrency:
  group: android-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "배포 버전: $VERSION (versionCode=${{ github.run_number }})"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # VITE_* 값은 빌드 시점에 번들에 박힌다. 누락되면 빌드는 성공하지만
      # 설치된 앱의 해당 기능이 조용히 죽는다 (#112 참고).
      - name: Bundle web assets
        working-directory: frontend
        run: npm run mobile:android
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_KAKAO_MAP_APP_KEY: ${{ secrets.VITE_KAKAO_MAP_APP_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Verify API base URL is embedded
        working-directory: frontend
        run: |
          set -euo pipefail
          if ! grep -rq "$VITE_API_BASE_URL" android/app/src/main/assets/public/assets/; then
            echo "::error::번들에 API 주소가 없다. VITE_API_BASE_URL secret을 확인하라."
            exit 1
          fi
          echo "번들에 API 주소 확인됨."
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest :app:assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version }}

      # 서명이 빠지면 gradle은 app-release-unsigned.apk를 만들고 빌드는 성공한다.
      # 그대로 배포하면 설치 자체가 불가능하므로 여기서 끊는다.
      - name: Verify APK is signed
        working-directory: frontend/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK 없음. 서명이 걸리지 않았다 (ANDROID_KEYSTORE_* secret 확인)."
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -r | head -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        working-directory: frontend/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="${{ secrets.APK_S3_BUCKET }}"
          CT="application/vnd.android.package-archive"

          # 버전별 백업 (롤백용) — 먼저 올려서 실패 시 latest가 오염되지 않게 한다
          aws s3 cp "$APK" "s3://$BUCKET/app/archive/app-v$VERSION.apk" \
            --content-type "$CT"

          # QR코드가 가리키는 고정 경로. 파일명이 고정이므로 캐시를 막아야 한다
          aws s3 cp "$APK" "s3://$BUCKET/app/latest.apk" \
            --content-type "$CT" \
            --cache-control "no-cache, no-store, must-revalidate"

          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "versionCode": ${{ github.run_number }},
            "commit": "$GITHUB_SHA",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          aws s3 cp version.json "s3://$BUCKET/app/latest-version.json" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate"

          echo "### APK 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 버전: \`$VERSION\` (versionCode ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- 고정 URL: \`s3://$BUCKET/app/latest.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 백업: \`s3://$BUCKET/app/archive/app-v$VERSION.apk\`" >> "$GITHUB_STEP_SUMMARY"
