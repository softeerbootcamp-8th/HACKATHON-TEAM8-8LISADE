services:
  mysql:
    image: mysql:8.4
    container_name: boilerplate-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-boilerplate}
      MYSQL_USER: ${DB_USERNAME:-boilerplate}
      MYSQL_PASSWORD: ${DB_PASSWORD:-boilerplate}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
