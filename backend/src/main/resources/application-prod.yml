spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: None

app:
  security:
    cors:
      allowed-origins:
        - ${CORS_ALLOWED_ORIGIN:https://8lisade.vercel.app}
    csrf-cookie:
      secure: true
      same-site: None

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

storage:
  s3:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
