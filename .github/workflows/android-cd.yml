name: Release Android APK

on:
  push:
    # main push = develop -> main 릴리즈 머지. 백엔드 배포와 같은 이벤트라
    # APK와 서버가 항상 같은 코드에서 나간다.
    branches: [main]
    # 핫픽스나 수동 재배포용. main push와 간섭하지 않는다.
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '배포할 버전 (예: 1.0.0). 태그 없이 수동 배포할 때만 사용.'
        required: true
      prerelease:
        description: 'prerelease로 표시 (latest URL을 갱신하지 않음)'
        type: boolean
        default: true

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # prerelease는 latest 다운로드 URL을 갱신하지 않는다.
      # v1.0.0-rc1 처럼 하이픈이 있는(semver prerelease) 태그는 자동으로 prerelease 처리한다.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              VERSION="${{ inputs.version }}"
              PRERELEASE="${{ inputs.prerelease }}"
              ;;
            *)
              if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                VERSION="${GITHUB_REF_NAME#v}"
                case "$VERSION" in
                  *-*) PRERELEASE=true ;;
                  *)   PRERELEASE=false ;;
                esac
              else
                # main push — run_number로 단조 증가시킨다. 태그 충돌이 구조적으로 없다.
                VERSION="1.0.${{ github.run_number }}"
                PRERELEASE=false
              fi
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "버전 $VERSION (versionCode=${{ github.run_number }}, prerelease=$PRERELEASE)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # VITE_* 값은 빌드 시점에 번들에 박힌다. 누락되면 빌드는 성공하지만
      # 설치된 앱의 해당 기능이 조용히 죽는다 (#112).
      - name: Bundle web assets
        working-directory: frontend
        run: npm run mobile:android
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_KAKAO_MAP_APP_KEY: ${{ secrets.VITE_KAKAO_MAP_APP_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Verify API base URL is embedded
        working-directory: frontend
        run: |
          set -euo pipefail
          if ! grep -rq "$VITE_API_BASE_URL" android/app/src/main/assets/public/assets/; then
            echo "::error::번들에 API 주소가 없다. VITE_API_BASE_URL secret을 확인하라."
            exit 1
          fi
          echo "번들에 API 주소 확인됨."
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore keystore
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest :app:assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version }}

      # 서명이 빠지면 gradle은 app-release-unsigned.apk를 만들고 빌드는 성공한다.
      # 그대로 배포하면 설치 자체가 불가능하므로 여기서 끊는다.
      # 자산 파일명은 고정이어야 한다 — QR코드가 가리키는 URL의 일부이기 때문.
      - name: Verify APK and stage asset
        id: apk
        run: |
          set -euo pipefail
          BUILT=frontend/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$BUILT" ]; then
            echo "::error::$BUILT 없음. 서명이 걸리지 않았다 (ANDROID_KEYSTORE_* secret 확인)."
            ls -l frontend/android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -r | head -1)
          "$APKSIGNER" verify --print-certs "$BUILT"
          cp "$BUILT" "$RUNNER_TEMP/8lisade.apk"
          echo "path=$RUNNER_TEMP/8lisade.apk" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            # 태그가 없는 경로(main push / workflow_dispatch)는
            # gh release create가 이 커밋에 태그를 만들어 준다.
            TAG="v$VERSION"
          fi

          FLAGS=(--generate-notes --title "v$VERSION" --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          gh release create "$TAG" "$APK" "${FLAGS[@]}"

          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "### APK 릴리즈 완료"
            echo ""
            echo "- 버전: \`v$VERSION\` (versionCode ${{ github.run_number }})"
            echo "- prerelease: \`$PRERELEASE\`"
            echo "- 이 릴리즈: $REPO_URL/releases/tag/$TAG"
            if [ "$PRERELEASE" = "false" ]; then
              echo "- **고정 다운로드 URL (QR코드용)**: $REPO_URL/releases/latest/download/8lisade.apk"
            else
              echo "- prerelease이므로 고정 \`latest\` URL은 갱신되지 않았다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
