services:
  backend:
    image: ${IMAGE}
    container_name: travel-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # EC2 instance profile supplies AWS credentials; the bucket name is deployment configuration.
      S3_BUCKET: ${S3_BUCKET:-8lisade-mission-image-upload-762794225137-ap-northeast-2-an}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # file: prefix is required — Spring's DefaultResourceLoader treats an unprefixed path as a
      # classpath resource, not a filesystem path (#199).
      FIREBASE_CREDENTIALS_PATH: file:/run/secrets/firebase-service-account.json
    volumes:
      # Restored on the host by backend-cd.yml before `docker compose up`; never baked into the image.
      - ./firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
