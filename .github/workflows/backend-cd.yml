name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'

concurrency:
  group: backend-deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: vars
        run: echo "image_name=$(echo '${{ github.repository }}/backend' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set image output
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: mkdir -p ~/app

      - name: Sync docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'backend/docker-compose.prod.yml'
          target: '~/app'
          strip_components: 1

      # FIREBASE_SERVICE_ACCOUNT_BASE64는 Firebase Admin SDK 서비스 계정 JSON이다(발송용).
      # google-services.json(안드로이드 수신용, android-cd.yml에서 복원)과는 다른 파일이다.
      # 값을 checkout에 넣지 않고 EC2에만 복원한다 — 저장소·이미지·로그에 노출되면 안 된다 (#199).
      - name: Restore Firebase service account credentials
        uses: appleboy/ssh-action@v1.2.2
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FIREBASE_SERVICE_ACCOUNT_BASE64
          script: |
            set -euo pipefail
            cd ~/app
            echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 -d > firebase-service-account.json
            chmod 600 firebase-service-account.json
            test -s firebase-service-account.json
            PROJECT_ID=$(python3 -c "import json; print(json.load(open('firebase-service-account.json'))['project_id'])")
            if [ "$PROJECT_ID" != "hackathon-team8-8lisade" ]; then
              echo "firebase-service-account.json의 project_id가 '$PROJECT_ID'다. hackathon-team8-8lisade여야 한다."
              exit 1
            fi
            echo "Firebase 서비스 계정 복원 확인됨 ($PROJECT_ID)."

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD
          script: |
            set -euo pipefail
            cd ~/app
            cat > .env <<EOF
            IMAGE=$IMAGE
            DB_HOST=$DB_HOST
            DB_PORT=$DB_PORT
            DB_NAME=$DB_NAME
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            EOF
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

      # FirebaseConfig는 자격증명이 없거나 잘못돼도 warn만 남기고 앱은 정상 기동한다 — 배포가
      # 초록불이어도 push가 조용히 안 나갈 수 있다는 뜻이라 별도로 확인한다 (#199).
      # 콘솔 appender는 WARN 이상만 출력하므로(#144) `docker compose logs`(stdout)에는
      # 성공 로그(INFO)가 찍히지 않는다. FILE appender가 쓰는 호스트 마운트 파일
      # (~/app/logs/travel.log)을 직접 읽는다 (#213).
      - name: Verify Firebase Admin initialized
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/app
            LOG_FILE=logs/travel.log
            for i in $(seq 1 30); do
              LOGS=$(cat "$LOG_FILE" 2>/dev/null || true)
              if echo "$LOGS" | grep -q "Firebase Admin initialized"; then
                echo "Firebase Admin 초기화 확인됨."
                exit 0
              fi
              if echo "$LOGS" | grep -qE "firebase.credentials-path is not set|Failed to initialize Firebase"; then
                echo "Firebase Admin이 초기화되지 않았다 — 자격증명 mount를 확인하라."
                echo "$LOGS" | grep -i firebase
                exit 1
              fi
              sleep 2
            done
            echo "30회 시도 후에도 Firebase 초기화 로그를 찾지 못했다."
            echo "$LOGS" | tail -n 50
            exit 1
